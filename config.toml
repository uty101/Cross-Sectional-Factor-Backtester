# The single source of truth for every knob in src/ (PLAN.md, invariant 9).
# Sensitivity tables are produced by looping over this file, not by editing
# code. Dates are month-ends; windows are in the units named.

[window]
start = "2010-01-31"
end = "2026-08-31"

[universe]
index = "sp500"

[portfolio]
n_deciles = 10
min_names = 50          # a month with fewer names forms no portfolio (a 5-name decile is not one)
weighting = "ew"        # "ew" or "cw"
rebalance = "M"
lag_days = 1            # signal at close t, trade at close t + lag_days
holding_months = 1

[costs]
base_bps = 10           # one-way, large caps
sensitivity_bps = [5, 10, 25]

[delisting]
# The 'terminal' sensitivity (BUILD_PLAN 8.2): a name removed from the
# index with no price after its removal earns this in the month after its
# last print, instead of leaving the portfolio at that print.
terminal_return = -0.30

[prices]
# Cross-source reconcile (FIX_PLAN F6): a month where yfinance's and
# Tiingo's returns differ by more than this is a conflict, logged to
# data/checks/price_conflicts.csv; Tiingo wins the month.
conflict_threshold = 0.01

[signals]
winsor = [0.01, 0.99]
momentum_window = [12, 1]   # months back, months skipped
vol_window = 252            # trading days
beta_window = 252           # trading days

[fundamentals]
asof_buffer_days = 1        # filed on or before t - buffer

[text]
similarity = "cosine"       # "cosine" (term counts) or "jaccard" (word sets)
min_words = 1000            # a shorter 10-K is a wrapper round an exhibit; treated as missing

[validation]
# Minimum correlation of each long-short series with its benchmark
# (BUILD_PLAN 8.1). momentum/value/quality vs UMD/HML/RMW are the brief's
# bar; the replicas are the single-signal French constructions; beta is
# against AQR's BAB. A miss is reported, never tuned away (CLAUDE.md).
momentum = 0.70
value = 0.70
quality = 0.70
hml_replica = 0.60
rmw_replica = 0.60
beta = 0.50
beta_hedged = 0.50           # the same series with its rolling market beta hedged out (FIX_PLAN F5)

[checks]
# Dagster asset checks (BUILD_PLAN 10.5). A failing blocking check stops
# what depends on the asset.
universe_min = 490
universe_max = 510
max_recent_price_gap_pct = 5.0             # mean over the last 12 months
min_recent_fundamentals_coverage = 0.75    # assets, equity, net income, revenue
# Public-float cross-check (FIX_PLAN_3 H1): a (ticker, fiscal year) whose
# month-end close x shares over the 10-K's EntityPublicFloat is outside
# [lo, hi] is not that filer's price or count, and is excluded from every
# signal for the 12 months after the float date.
float_ratio_lo = 0.5
float_ratio_hi = 20

[paths]
data = "data"
reports = "reports"
specifications = "reports/specifications.csv"
