[project]
name = "backtester"
version = "0.1.0"
description = "Cross-sectional factor backtester: point-in-time US equity factor research with costs, decay and overfitting control."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "requests>=2.32",
    "yfinance>=0.2.40",
    "fpdf2>=2.8.8",
    "anthropic>=1.5.0",
]

[project.scripts]
backtester = "backtester.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "statsmodels>=0.14",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows are one line each by nature.
"src/backtester/report.py" = ["E501"]
"src/backtester/methodology.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
