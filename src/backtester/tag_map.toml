# XBRL tags for each concept, in priority order: within a filing the first
# tag present wins. Companies report the same concept under different tags
# (and change over the years), so the list is ordered and the coverage per
# concept per year is committed in data/checks/tag_coverage.csv.
#
# kind = "flow"  income or cash-flow item; annual value from a 10-K (qtrs 4)
# kind = "stock" balance-sheet or share count; latest 10-K or 10-Q (qtrs 0)

[concept.assets]
kind = "stock"
# AssetsNet: Honeywell's total assets tag in FY2010-11 (FIX_PLAN F1 audit).
tags = ["Assets", "AssetsNet"]

[concept.equity]
kind = "stock"
tags = [
  "StockholdersEquity",
  "StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest",
]

[concept.liabilities]
kind = "stock"
tags = ["Liabilities"]

[concept.current_assets]
kind = "stock"
tags = ["AssetsCurrent"]

[concept.current_liabilities]
kind = "stock"
tags = ["LiabilitiesCurrent"]

[concept.cash]
kind = "stock"
tags = [
  "CashAndCashEquivalentsAtCarryingValue",
  "CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents",
]

[concept.shares]
kind = "stock"
tags = [
  "EntityCommonStockSharesOutstanding",
  "CommonStockSharesOutstanding",
]

[concept.net_income]
kind = "flow"
tags = [
  "NetIncomeLoss",
  "ProfitLoss",
  "NetIncomeLossAvailableToCommonStockholdersBasic",
]

# The last four were added in FIX_PLAN F3 from data/checks/tag_gap_revenue_*.csv:
# each is the whole top line for the filers that use it (service companies,
# regulated utilities, REITs, E&Ps) and 5 or more universe filers with no
# revenue value used it in FY2011 or FY2015. Banks have no revenue tag at
# all; their revenue is derived (net_interest_income + noninterest_income,
# fundamentals.build), never taken from gross interest income.
[concept.revenue]
kind = "flow"
tags = [
  "Revenues",
  "RevenueFromContractWithCustomerExcludingAssessedTax",
  "SalesRevenueNet",
  "RevenueFromContractWithCustomerIncludingAssessedTax",
  "SalesRevenueGoodsNet",
  "RevenuesNetOfInterestExpense",
  "SalesRevenueServicesNet",
  "RegulatedAndUnregulatedOperatingRevenue",
  "RealEstateRevenueNet",
  "OilAndGasRevenue",
]

# Bank revenue = net interest income + noninterest income (FIX_PLAN F3).
[concept.net_interest_income]
kind = "flow"
tags = ["InterestIncomeExpenseNet"]

[concept.noninterest_income]
kind = "flow"
tags = ["NoninterestIncome"]

# CostsAndExpenses and OperatingCostsAndExpenses are never cogs: they
# include SG&A (FIX_PLAN F3). The last tag was added in F3 from
# data/checks/tag_gap_cogs_*.csv (7 and 13 missing filers in FY2011 and
# FY2015).
[concept.cogs]
kind = "flow"
tags = [
  "CostOfRevenue",
  "CostOfGoodsAndServicesSold",
  "CostOfGoodsSold",
  "CostOfServices",
  "CostOfGoodsAndServiceExcludingDepreciationDepletionAndAmortization",
  "CostOfGoodsSoldExcludingDepreciationDepletionAndAmortization",
]

[concept.gross_profit]
kind = "flow"
tags = ["GrossProfit"]

[concept.operating_income]
kind = "flow"
tags = ["OperatingIncomeLoss"]

[concept.cfo]
kind = "flow"
tags = [
  "NetCashProvidedByUsedInOperatingActivities",
  "NetCashProvidedByUsedInOperatingActivitiesContinuingOperations",
]

[concept.capex]
kind = "flow"
tags = [
  "PaymentsToAcquirePropertyPlantAndEquipment",
  "PaymentsToAcquireProductiveAssets",
]

[concept.depreciation]
kind = "flow"
tags = [
  "DepreciationDepletionAndAmortization",
  "DepreciationAndAmortization",
  "DepreciationAmortizationAndAccretionNet",
]

# Fallback share count for market cap: the diluted weighted average over
# the latest reported period (10-Q quarter or 10-K year), taken whenever
# the balance-sheet count is missing or reported only by share class.
[concept.shares_wavg]
kind = "latest_flow"
tags = [
  "WeightedAverageNumberOfDilutedSharesOutstanding",
  "WeightedAverageNumberOfSharesOutstandingBasic",
]

# Pre-tax income: revenue less all operating costs and interest, which is
# closer to French's operating profitability than OperatingIncomeLoss (that
# tag is before interest and is not reported by banks or insurers at all).
[concept.pretax_income]
kind = "flow"
tags = [
  "IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest",
  "IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments",
  "IncomeLossFromContinuingOperationsBeforeIncomeTaxesDomestic",
  "IncomeLossBeforeIncomeTaxes",
]

# Book equity at the fiscal year end, from the 10-K only: the period-matched
# denominator French uses for operating profitability.
[concept.equity_fy]
kind = "annual_stock"
tags = [
  "StockholdersEquity",
  "StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest",
]

# The 10-K cover page's market value of non-affiliate shares at the end
# of the second fiscal quarter (FIX_PLAN_3 H1): ddate is the float date,
# and price x shares at that date must be at least the float and rarely
# more than a few times it (fundamentals.public_float_check). Like the
# cover share count, the FSDS carries it for almost no filer (12 of 4,697
# 10-Ks in 2015q1, none in 2024q1), so the companyconcept API is the
# source (shares.fetch_float) and these rows are the supplement.
[concept.public_float]
kind = "annual_stock"
tags = ["dei:EntityPublicFloat", "EntityPublicFloat"]
